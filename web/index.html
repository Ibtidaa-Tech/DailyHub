<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DailyHub — tasks, reminders, money, notes and habits in one calm place.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DailyHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DailyHub</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F5F6F8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0E1014; } }
    #dh-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #dh-splash svg { width: 72px; height: 72px; animation: dh-pulse 1.4s ease-in-out infinite; }
    @keyframes dh-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .8; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="dh-splash" aria-label="Loading DailyHub">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
      <rect width="100" height="100" rx="28" fill="url(#g)"/>
      <rect x="22.75" y="22.75" width="24.5" height="24.5" rx="6.4" fill="#fff"/>
      <path d="M29.1 35.7 L33.5 39.9 L41.1 31.1" stroke="#4F46E5" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52.75" y="22.75" width="24.5" height="24.5" rx="6.4" fill="#fff" fill-opacity=".42"/>
      <rect x="22.75" y="52.75" width="24.5" height="24.5" rx="6.4" fill="#fff" fill-opacity=".42"/>
      <circle cx="65" cy="65" r="12.25" fill="#fff" fill-opacity=".9"/>
      <circle cx="65" cy="65" r="4.9" fill="#7C3AED"/>
    </svg>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
