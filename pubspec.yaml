name: dailyhub
description: "DailyHub - your whole day in one calm place: plan, money, notes, habits and more."
publish_to: "none"
version: 2.1.2+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (same project as your web app: khurram-world)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Fonts (Plus Jakarta Sans)
  google_fonts: ^6.2.1

  # Update checker (GitHub Releases API) — pure Dart, no native plugin
  http: ^1.2.2

  # Encrypted, device-only vault (never synced to Firebase)
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Photo attachments (receipts, note images)
  image_picker: ^1.1.2
  firebase_storage: ^12.3.2

  # Voice notes
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # File attachments (PDFs, docs)
  file_picker: ^8.1.4

  # QR / barcode scanning
  mobile_scanner: ^5.2.3

  # Current location for Places & parking
  geolocator: ^13.0.1

  # Local notifications (reminders that fire when app is closed)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Storage & utilities
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.1

# `record: ^5.1.2` pulls in the old record_linux 0.7.2, which doesn't implement
# `startStream` / `hasPermission(request:)` that record_platform_interface 1.6.0
# added. Flutter compiles every plugin's Dart even for an Android build, so that
# mismatch fails the build with "RecordLinux is missing implementations".
# The range below just lets pub pick a record_linux that matches the interface
# the rest of the plugin family resolved to. It only affects Linux desktop.
dependency_overrides:
  record_linux: ">=0.7.2 <3.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
